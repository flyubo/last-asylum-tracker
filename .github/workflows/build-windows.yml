name: Build LA Tracker for Windows

on:
  push:
    branches: [la-api-platform]
    paths:
      - "la_api/**"
      - "run_la_tracker.py"
      - ".github/workflows/build-windows.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: la-api-platform
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install packager
        run: python -m pip install pyinstaller
      - name: Build standalone executable
        run: >-
          pyinstaller --clean --noconfirm --onefile --name LA-Tracker
          --add-data "la_api/local_console.html;la_api"
          --add-data "la_api/api_catalog.json;la_api"
          run_la_tracker.py
      - name: Upload Windows executable
        uses: actions/upload-artifact@v4
        with:
          name: LA-Tracker-Windows
          path: dist/LA-Tracker.exe
          retention-days: 7
