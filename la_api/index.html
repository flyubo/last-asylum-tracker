<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LA Tracker · API Explorer</title>
<style>
:root{color-scheme:dark;font-family:Inter,system-ui,"Segoe UI",sans-serif;background:#0b1220;color:#e8eef8}*{box-sizing:border-box}body{margin:0}header{padding:22px 26px;background:#121d30;border-bottom:1px solid #2a3850}header h1{margin:0 0 6px;font-size:24px}header p,.muted{color:#9eafc7;margin:0}main{max-width:1440px;margin:auto;padding:20px}.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}input,select{background:#142239;border:1px solid #354660;color:#edf4ff;border-radius:9px;padding:11px;font:inherit}input{flex:1;min-width:250px}.stats{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}.stat,.panel{background:#121d30;border:1px solid #293851;border-radius:12px}.stat{padding:12px 16px}.stat b{font-size:20px;display:block}.layout{display:grid;grid-template-columns:minmax(320px,.9fr) minmax(400px,1.1fr);gap:14px}.panel{overflow:hidden}.panel h2{font-size:15px;margin:0;padding:14px;border-bottom:1px solid #293851}.list{max-height:72vh;overflow:auto}.item{padding:12px 14px;border-bottom:1px solid #25334a;cursor:pointer}.item:hover,.item.active{background:#1a2a43}.item strong{display:block;font-size:14px}.item small{color:#9eafc7}.tag{display:inline-block;font-size:11px;padding:2px 7px;border:1px solid #43536d;border-radius:20px;margin-left:6px;color:#b7c8df}.detail{padding:16px}.detail h3{margin:0 0 6px;font-size:19px}.fields{width:100%;border-collapse:collapse;margin-top:14px}.fields th,.fields td{text-align:left;padding:9px;border-bottom:1px solid #293851;font-size:13px}.fields th{color:#9eafc7}.empty{padding:22px;color:#9eafc7}.note{margin-top:14px;color:#9eafc7;font-size:12px;line-height:1.6}@media(max-width:850px){.layout{grid-template-columns:1fr}.list{max-height:45vh}}
</style></head><body><header><h1>LA Tracker · API Explorer</h1><p>Last Asylum 메시지 / Protobuf 스키마 검색</p></header><main>
<div class="stats"><div class="stat"><b id="total">—</b><span class="muted">카탈로그 항목</span></div><div class="stat"><b id="indexed">—</b><span class="muted">스키마 연결</span></div><div class="stat"><b id="requests">—</b><span class="muted">C2S 요청</span></div><div class="stat"><b id="responses">—</b><span class="muted">S2C 응답</span></div></div>
<div class="toolbar"><input id="q" placeholder="API 이름, 필드명, 스키마 파일 검색"><select id="direction"><option value="all">전체 방향</option><option value="request">C2S 요청</option><option value="response">S2C 응답</option><option value="other">기타</option></select><select id="schema"><option value="all">모든 스키마</option></select></div>
<div class="layout"><section class="panel"><h2>API 목록 <span class="muted" id="shown"></span></h2><div class="list" id="list"><div class="empty">카탈로그 불러오는 중…</div></div></section><section class="panel"><h2>메시지 상세</h2><div class="detail" id="detail"><div class="empty">왼쪽 목록에서 API를 선택하세요.</div></div></section></div>
<p class="note">이 화면은 복구된 메시지 이름과 Protobuf 필드 구조를 검색하는 카탈로그입니다. 실제 서버 호출에는 본인 게임 클라이언트의 정상 인증 세션이 필요합니다. 계정 토큰·인증값은 이 정적 페이지나 Git 저장소에 저장하지 않습니다.</p></main>
<script>
const $=id=>document.getElementById(id);let apis=[],selected=null;const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
async function init(){try{const r=await fetch("./api_catalog.json");if(!r.ok)throw Error("HTTP "+r.status);const data=await r.json();apis=data.apis||[];$("total").textContent=data.count.toLocaleString();$("indexed").textContent=apis.filter(x=>x.indexed).length.toLocaleString();$("requests").textContent=apis.filter(x=>x.direction==="request").length.toLocaleString();$("responses").textContent=apis.filter(x=>x.direction==="response").length.toLocaleString();for(const s of [...new Set(apis.map(x=>x.schema_file).filter(Boolean))].sort()){const o=document.createElement("option");o.value=s;o.textContent=s;$("schema").append(o)}render()}catch(e){$("list").innerHTML='<div class="empty">카탈로그 로드 실패: '+esc(e.message)+"</div>"}}
function render(){const q=$("q").value.trim().toLowerCase(),d=$("direction").value,s=$("schema").value;const rows=apis.filter(a=>(d==="all"||a.direction===d)&&(s==="all"||a.schema_file===s)&&(!q||a.search_text.includes(q)));$("shown").textContent="("+rows.length.toLocaleString()+")";$("list").innerHTML=rows.slice(0,1200).map(a=>'<div class="item '+(selected===a.name?"active":"")+'" data-name="'+esc(a.name)+'"><strong>'+esc(a.name)+'<span class="tag">'+(a.direction==="request"?"C2S":a.direction==="response"?"S2C":"기타")+'</span></strong><small>'+esc(a.schema_file||"스키마 미연결")+" · "+a.fields.length+" fields</small></div>").join("")||'<div class="empty">검색 결과가 없습니다.</div>';document.querySelectorAll(".item").forEach(el=>el.addEventListener("click",()=>show(el.dataset.name)))}
function show(name){const a=apis.find(x=>x.name===name);if(!a)return;selected=name;render();$("detail").innerHTML="<h3>"+esc(a.name)+"</h3><div class=\"muted\">"+esc(a.schema_file||"스키마 미연결")+" · "+(a.direction==="request"?"클라이언트 → 서버":a.direction==="response"?"서버 → 클라이언트":"기타 메시지")+"</div>"+(a.fields.length?'<table class="fields"><thead><tr><th>필드</th><th>자료형</th><th>번호</th></tr></thead><tbody>'+a.fields.map(f=>"<tr><td>"+esc(f.name)+"</td><td>"+esc(f.type)+"</td><td>"+f.number+"</td></tr>").join("")+"</tbody></table>":'<div class="empty">연결된 필드 스키마가 없습니다.</div>')}
$("q").addEventListener("input",render);$("direction").addEventListener("change",render);$("schema").addEventListener("change",render);init();
</script></body></html>
