databases:
  - name: lastasylum-tracker-db
    databaseName: lastasylum_tracker
    user: lastasylum_tracker
    plan: basic-256mb
    region: singapore

services:
  - type: web
    name: lastasylum-private-dashboard
    runtime: python
    plan: starter
    region: singapore
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: lastasylum-tracker-db
          property: connectionString
      - key: DASHBOARD_USERNAME
        sync: false
      - key: DASHBOARD_PASSWORD
        sync: false

  - type: cron
    name: lastasylum-daily-collector
    runtime: python
    plan: starter
    region: singapore
    schedule: "0 23 * * *"
    buildCommand: pip install -r requirements.txt
    startCommand: python worker.py --server 149
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: lastasylum-tracker-db
          property: connectionString
